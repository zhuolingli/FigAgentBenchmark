[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figagentbenchmark"
version = "0.1.0"
description = "Collection, curation and portable export of editable scientific figure datasets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["boto3>=1.34,<2", "Pillow>=10"]

[project.optional-dependencies]
quality = ["numpy>=1.26", "scipy>=1.11", "torch>=2.4", "transformers==4.49.0"]
render = ["PyMuPDF>=1.24"]
hub = ["huggingface_hub>=0.30"]

[project.scripts]
drawio-cloud = "drawio_cloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
